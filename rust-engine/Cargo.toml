[package]
name = "rust-engine"
version = "0.1.0"
edition = "2024"
description = "Rust/WebAssembly image-processing kernels for Oxide Lab"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Current Rust emits standard bulk-memory and saturating-conversion operations
# that the wasm-opt binary bundled with some wasm-pack releases cannot parse.
# LLVM still performs the release optimizations below; disabling this optional
# post-pass keeps builds reproducible across developer and deployment machines.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Favor runtime performance for the benchmarked processing kernels. LTO and a
# single codegen unit also let LLVM optimize across this small crate without
# adding runtime dependencies or changing the algorithms under comparison.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
