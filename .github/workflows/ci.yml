name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust, WASM, and web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-engine -> target

      - name: Check Rust formatting
        working-directory: rust-engine
        run: cargo fmt -- --check

      - name: Lint Rust
        working-directory: rust-engine
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: rust-engine
        run: cargo test --all-features

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify committed WebAssembly package
        working-directory: web
        run: npm run verify:wasm

      - name: Lint, test, typecheck, and build frontend
        working-directory: web
        run: npm run check
